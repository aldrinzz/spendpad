<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>SpendPad</title>
  <meta name="description" content="Daily spending tracker for two.">
  <meta name="theme-color" content="#F3F1EC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0C0D0F" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SpendPad">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <span id="dateLabel" class="date"></span>
      <button id="settingsBtn" class="icon-btn" type="button" aria-label="Settings and sync">
        <span id="syncDot" class="dot"></span>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Zm7.43-2.53c.04-.32.07-.64.07-.97s-.03-.66-.07-.98l2.11-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a7.3 7.3 0 0 0-1.69-.98l-.38-2.65A.49.49 0 0 0 14 2h-4a.49.49 0 0 0-.49.42l-.38 2.65c-.61.25-1.17.58-1.69.98l-2.49-1a.5.5 0 0 0-.61.22l-2 3.46a.49.49 0 0 0 .12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.65.07.97l-2.11 1.65a.5.5 0 0 0-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65a7.3 7.3 0 0 0 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46a.5.5 0 0 0-.12-.64l-2.11-1.65Z"/></svg>
      </button>
    </header>

    <section class="info">
      <div id="alerts" class="alerts"></div>
      <button id="todayCard" class="today" type="button" data-sheet="today">
        <span class="today-head"><span id="todayLabel" class="label">Left today</span><span id="todaySpent" class="spent"></span></span>
        <span id="todayLeft" class="today-num">₹0</span>
        <span id="todayBreak" class="today-break"></span>
        <span class="bar"><i id="todayBar"></i></span>
      </button>

      <button id="salaryTile" class="tile wide" type="button" data-sheet="salary">
        <span class="tile-main"><span class="label">Salary left</span><span id="salaryLeft" class="value">₹0</span></span>
        <span id="salaryTotal" class="tile-side"></span>
      </button>

      <div class="tiles">
        <button id="cardTile" class="tile" type="button" data-sheet="card">
          <span class="label">Card owed</span>
          <span id="cardOwed" class="value">₹0</span>
          <span id="cardDue" class="sub"></span>
        </button>
        <button id="emergTile" class="tile" type="button" data-sheet="emergency">
          <span class="label">Emergency</span>
          <span id="emerg" class="value">₹0</span>
          <span class="sub">set aside</span>
        </button>
      </div>
    </section>

    <section class="entry">
      <div class="amount-row">
        <span id="amount" class="amount empty" aria-live="polite">₹0</span>
        <button id="whoChip" class="chip" type="button" aria-label="Who is spending"></button>
      </div>
      <div id="pad" class="pad">
        <div class="digits">
          <button type="button" data-k="1">1</button>
          <button type="button" data-k="2">2</button>
          <button type="button" data-k="3">3</button>
          <button type="button" data-k="4">4</button>
          <button type="button" data-k="5">5</button>
          <button type="button" data-k="6">6</button>
          <button type="button" data-k="7">7</button>
          <button type="button" data-k="8">8</button>
          <button type="button" data-k="9">9</button>
          <button type="button" data-k="00">00</button>
          <button type="button" data-k="0">0</button>
          <button type="button" data-k="del" aria-label="Delete (hold to clear)">
            <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7 6-7Zm3 4 6 6m0-6-6 6"/></svg>
          </button>
        </div>
        <div class="acts">
          <button id="btnCard" class="act card" type="button" data-method="card"><b>Card</b><small id="cycleCard">₹0</small><small class="hint">this cycle</small></button>
          <button id="btnUpi" class="act upi" type="button" data-method="upi"><b>UPI</b><small id="cycleUpi">₹0</small><small class="hint">on card · cycle</small></button>
          <button id="btnBank" class="act bank" type="button" data-method="bank"><b>Bank</b><small id="monthBank">₹0</small><small class="hint">this month</small></button>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status"></div>

  <div id="sheetWrap" class="sheet-wrap" hidden>
    <div class="scrim"></div>
    <div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
  </div>

  <!-- iPhone has no vibration API; tapping a native switch makes the Taptic Engine tick (iOS 18+). -->
  <input type="checkbox" switch id="hap" class="hap" tabindex="-1" aria-hidden="true"><label for="hap" id="hapLabel" class="hap"></label>

  <script src="budget.js"></script>
  <script src="app.js"></script>
</body>
</html>
